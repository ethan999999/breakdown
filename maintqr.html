<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaintQR — Lapor & Tangani Kerusakan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1d23; --muted: #6b7280; --border: #e5e7eb;
    --accent: #d97706; --accent-text: #ffffff; --open: #dc2626; --progress: #d97706; --done: #16a34a;
    --danger-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14161a; --card: #1e2127; --text: #f0f1f3; --muted: #9aa1ad; --border: #2c3038; --danger-bg: #3a1a1a; }
  }
  :root[data-theme="dark"] { --bg: #14161a; --card: #1e2127; --text: #f0f1f3; --muted: #9aa1ad; --border: #2c3038; --danger-bg: #3a1a1a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px; background: var(--accent); color: var(--accent-text); }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
  .tab-btn { flex: 1; padding: 10px 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .02em; }
  .badge.open { background: var(--open); } .badge.progress { background: var(--progress); } .badge.done { background: var(--done); }
  button.action { margin-top: 10px; width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; }
  button.claim { background: var(--open); } button.finish { background: var(--done); }
  input, textarea, select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 10px; font-family: inherit; }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .primary-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 700; cursor: pointer; }
  .center { text-align: center; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .stat .num { font-size: 22px; font-weight: 800; } .stat .lbl { font-size: 11.5px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-row button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }
  .filter-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .banner { padding: 12px; border-radius: 10px; background: var(--danger-bg); font-size: 13px; margin-bottom: 12px; }
  .qr-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }
  a.dl-link { display: inline-block; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<div id="app" class="center" style="padding:60px 20px;color:var(--muted);">Memuat…</div>
<script>
// ============ ISI URL WEB APP GOOGLE APPS SCRIPT KAMU DI SINI ============
const API_URL = 'https://script.google.com/macros/s/AKfycbzMc-ysIbhpf94jn98KmUQHNoFeoqwR9yJP7a3VnLNU8KDYkChmx9w_hH9YXGnDP53T/exec';
// ==========================================================================

const $ = (s, el) => (el || document).querySelector(s);
const app = $('#app');
let allTickets = [];
let activeTab = 'queue';
let summaryRange = 'today';
let pollTimer = null;

function baseUrl() { return location.origin + location.pathname; }
function techName() { return localStorage.getItem('maintqr_name') || ''; }
function setTechName(name) { localStorage.setItem('maintqr_name', name); }
function fmtDuration(ms) {
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + ' mnt';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h + ' j ' + m + ' mnt';
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }
function elapsed(ts) { return fmtDuration(Date.now() - ts); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight ke Apps Script
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}
async function fetchTickets() {
  const res = await fetch(API_URL);
  const data = await res.json();
  return data.tickets || [];
}

function init() {
  if (!API_URL || API_URL.indexOf('PASTE_URL') !== -1) {
    app.innerHTML = '<div style="padding:24px"><div class="banner">API_URL belum diisi. Buka file HTML, isi API_URL dengan link Web App Apps Script kamu, lalu upload ulang.</div></div>';
    return;
  }
  if (location.hash === '#lapor') {
    renderReport();
  } else {
    renderDashboard();
  }
}

// ---------- REPORT FORM (satu QR untuk semua) ----------
function renderReport() {
  app.innerHTML = `
    <header><h1>🛠️ Lapor Kerusakan Mesin</h1></header>
    <div class="wrap">
      <div class="card" id="reportCard">
        <label>ID Mesin</label>
        <input id="fMachine" placeholder="cth: Lectra Vector iQ80 - Line 3" />
        <label>Pelapor / Line</label>
        <input id="fReporter" placeholder="Nama kamu / Line produksi" />
        <label>Problem</label>
        <textarea id="fProblem" rows="4" placeholder="Jelaskan masalahnya singkat..."></textarea>
        <button class="primary-btn" id="fSubmit">Kirim Laporan</button>
      </div>
      <div id="reportDone" style="display:none" class="card center">
        <div style="font-size:40px;margin-bottom:6px;">✅</div>
        <div style="font-weight:700;font-size:16px;">Laporan tersimpan!</div>
        <div class="meta">Terakhir, kirim ke grup WA teknisi biar langsung kelihatan:</div>
        <a class="primary-btn" id="waBtn" style="display:block;margin-top:12px;text-decoration:none;" target="_blank">📤 Kirim ke Grup WA</a>
        <button class="primary-btn" style="margin-top:10px;background:var(--border);color:var(--text);" onclick="location.reload()">Lapor Lagi</button>
      </div>
    </div>`;

  const savedReporter = localStorage.getItem('maintqr_reporter');
  if (savedReporter) $('#fReporter').value = savedReporter;

  $('#fSubmit').onclick = async () => {
    const machine = $('#fMachine').value.trim();
    const reporter = $('#fReporter').value.trim();
    const problem = $('#fProblem').value.trim();
    if (!machine || !reporter || !problem) { alert('Isi semua kolom dulu, bro: ID mesin, pelapor/line, dan problem.'); return; }
    $('#fSubmit').disabled = true; $('#fSubmit').textContent = 'Mengirim...';
    try {
      const res = await api('add', { machine, reporter, problem });
      if (!res.ok) throw new Error(res.error || 'unknown');
      localStorage.setItem('maintqr_reporter', reporter);
      $('#reportCard').style.display = 'none';
      $('#reportDone').style.display = 'block';
      const waText = '🛠️ *Laporan Kerusakan Baru*\n' +
        'Mesin: ' + machine + '\n' +
        'Pelapor/Line: ' + reporter + '\n' +
        'Masalah: ' + problem + '\n' +
        'Waktu: ' + new Date().toLocaleString('id-ID') +
        '\n\n👉 Tangani di sini: ' + baseUrl();
      $('#waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(waText);
    } catch (e) {
      alert('Gagal kirim: ' + (e && e.message ? e.message : e));
      $('#fSubmit').disabled = false; $('#fSubmit').textContent = 'Kirim Laporan';
    }
  };
}

// ---------- DASHBOARD ----------
function renderDashboard() {
  app.innerHTML = `
    <header><h1>🛠️ MaintQR</h1></header>
    <div class="wrap">
      <div class="tabs">
        <button class="tab-btn" data-tab="queue">Antrian</button>
        <button class="tab-btn" data-tab="qr">QR Lapor</button>
        <button class="tab-btn" data-tab="summary">Ringkasan</button>
      </div>
      <div id="tabBody"><div class="empty">Memuat data...</div></div>
    </div>`;
  app.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  switchTab('queue');
  refreshTickets();
  pollTimer = setInterval(refreshTickets, 6000);
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'queue') renderQueue();
  if (tab === 'qr') renderQr();
  if (tab === 'summary') renderSummary();
}

async function refreshTickets() {
  try {
    allTickets = await fetchTickets();
    allTickets.sort((a, b) => b.createdAt - a.createdAt);
    if (activeTab === 'queue') renderQueue();
    if (activeTab === 'summary') renderSummary();
  } catch (e) {
    console.error('gagal ambil data', e);
  }
}

function renderQueue() {
  const body = $('#tabBody');
  const open = allTickets.filter(t => t.status === 'open');
  const progress = allTickets.filter(t => t.status === 'in_progress');
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const done = allTickets.filter(t => t.status === 'done' && t.finishedAt >= todayStart.getTime()).slice(0, 15);

  const nameBar = `<div class="card">
    <label>Nama kamu (buat klaim tiket)</label>
    <input id="techNameInput" value="${escapeHtml(techName())}" placeholder="Nama teknisi" />
  </div>`;

  const section = (title, items, renderFn, emptyMsg) => `
    <h3 style="margin:16px 4px 8px;font-size:14px;">${title} (${items.length})</h3>
    ${items.length ? items.map(renderFn).join('') : `<div class="empty">${emptyMsg}</div>`}`;

  body.innerHTML = nameBar +
    section('🔴 Baru Masuk', open, ticketCardOpen, 'Belum ada laporan baru.') +
    section('🟠 Sedang Ditangani', progress, ticketCardProgress, 'Tidak ada yang sedang ditangani.') +
    section('🟢 Selesai Hari Ini', done, ticketCardDone, 'Belum ada yang selesai hari ini.');

  $('#techNameInput').onchange = e => setTechName(e.target.value.trim());
  body.querySelectorAll('[data-claim]').forEach(btn => btn.onclick = () => claimTicket(btn.dataset.claim));
  body.querySelectorAll('[data-finish]').forEach(btn => btn.onclick = () => finishTicket(btn.dataset.finish));
}

function ticketCardOpen(t) {
  return `<div class="card">
    <span class="badge open">Baru</span>
    <h3>${escapeHtml(t.machine)}</h3>
    <div class="meta">${escapeHtml(t.problem)}</div>
    <div class="meta">Pelapor: ${escapeHtml(t.reporter)} · ${fmtTime(t.createdAt)} · ${elapsed(t.createdAt)} lalu</div>
    <button class="action claim" data-claim="${t.id}">Tangani</button>
  </div>`;
}
function ticketCardProgress(t) {
  return `<div class="card">
    <span class="badge progress">Ditangani</span>
    <h3>${escapeHtml(t.machine)}</h3>
    <div class="meta">${escapeHtml(t.problem)}</div>
    <div class="meta">Pelapor: ${escapeHtml(t.reporter)} · Teknisi: ${escapeHtml(t.technician || '-')}</div>
    <div class="meta">Downtime berjalan: ${elapsed(t.createdAt)}</div>
    <button class="action finish" data-finish="${t.id}">Selesai</button>
  </div>`;
}
function ticketCardDone(t) {
  const downtime = fmtDuration((t.finishedAt || t.createdAt) - t.createdAt);
  return `<div class="card">
    <span class="badge done">Selesai</span>
    <h3>${escapeHtml(t.machine)}</h3>
    <div class="meta">${escapeHtml(t.problem)}</div>
    <div class="meta">Pelapor: ${escapeHtml(t.reporter)} · Teknisi: ${escapeHtml(t.technician || '-')} · Total downtime: ${downtime}</div>
  </div>`;
}

async function claimTicket(id) {
  let name = techName();
  if (!name) {
    name = prompt('Nama kamu?');
    if (!name) return;
    setTechName(name);
  }
  try {
    const res = await api('claim', { id, technician: name });
    if (!res.ok) { alert(res.error === 'already_claimed' ? 'Tiket sudah ditangani duluan.' : 'Gagal klaim.'); }
    await refreshTickets();
  } catch (e) {
    alert('Gagal klaim: ' + (e && e.message ? e.message : e));
  }
}
async function finishTicket(id) {
  try {
    const res = await api('finish', { id });
    if (!res.ok) alert('Gagal update.');
    await refreshTickets();
  } catch (e) {
    alert('Gagal update: ' + (e && e.message ? e.message : e));
  }
}

// ---------- QR UNIVERSAL ----------
function renderQr() {
  const body = $('#tabBody');
  const url = baseUrl() + '#lapor';
  body.innerHTML = `
    <div class="card qr-box">
      <div style="font-weight:700;font-size:15px;">QR Lapor Kerusakan (Semua Area)</div>
      <div id="qrMain" style="width:220px;height:220px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;"></div>
      <div class="meta" style="word-break:break-all;text-align:center;">${url}</div>
      <a class="dl-link" id="dlBtn" download="qr-lapor-kerusakan.png">Download QR</a>
      <div class="meta" style="text-align:center;">Cetak dan tempel 1 QR ini di titik-titik strategis — semua orang bisa scan dan lapor dari QR yang sama.</div>
    </div>`;
  const container = $('#qrMain');
  if (window.QRCode) {
    new QRCode(container, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => {
      const canvas = container.querySelector('canvas');
      if (canvas) $('#dlBtn').href = canvas.toDataURL('image/png');
    }, 150);
  } else {
    container.innerHTML = '<div style="padding:10px;font-size:12px;color:#b91c1c;text-align:center;">QR gagal dimuat. Coba refresh halaman.</div>';
  }
}

// ---------- SUMMARY ----------
function renderSummary() {
  const body = $('#tabBody');
  const now = Date.now();
  const rangeStart = summaryRange === 'today'
    ? new Date(new Date().setHours(0,0,0,0)).getTime()
    : now - 7 * 24 * 3600 * 1000;

  const inRange = allTickets.filter(t => t.createdAt >= rangeStart);
  const doneInRange = inRange.filter(t => t.status === 'done');
  const totalDowntimeMs = doneInRange.reduce((sum, t) => sum + ((t.finishedAt || t.createdAt) - t.createdAt), 0);
  const avgMs = doneInRange.length ? totalDowntimeMs / doneInRange.length : 0;

  const byMachine = {};
  doneInRange.forEach(t => {
    byMachine[t.machine] = byMachine[t.machine] || { count: 0, ms: 0 };
    byMachine[t.machine].count++;
    byMachine[t.machine].ms += (t.finishedAt || t.createdAt) - t.createdAt;
  });
  const machineRows = Object.entries(byMachine).sort((a, b) => b[1].ms - a[1].ms).slice(0, 10);

  body.innerHTML = `
    <div class="filter-row">
      <button class="${summaryRange === 'today' ? 'active' : ''}" data-range="today">Hari Ini</button>
      <button class="${summaryRange === 'week' ? 'active' : ''}" data-range="week">7 Hari</button>
    </div>
    <div class="summary-grid">
      <div class="stat"><div class="num">${inRange.length}</div><div class="lbl">Total Laporan</div></div>
      <div class="stat"><div class="num">${doneInRange.length}</div><div class="lbl">Selesai</div></div>
      <div class="stat"><div class="num">${fmtDuration(totalDowntimeMs)}</div><div class="lbl">Total Downtime</div></div>
      <div class="stat"><div class="num">${fmtDuration(avgMs)}</div><div class="lbl">Rata-rata / Tiket</div></div>
    </div>
    <div class="card">
      <h3>Downtime per Mesin (Top 10)</h3>
      ${machineRows.length ? `<table><thead><tr><th>Mesin</th><th>Tiket</th><th>Downtime</th></tr></thead><tbody>
        ${machineRows.map(([name, v]) => `<tr><td>${escapeHtml(name)}</td><td>${v.count}</td><td>${fmtDuration(v.ms)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Belum ada data selesai di periode ini.</div>'}
      <div class="meta" style="margin-top:8px;">*Data langsung dari Google Sheets.</div>
    </div>`;

  body.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { summaryRange = b.dataset.range; renderSummary(); });
}

init();
</script>
</body>
</html>
